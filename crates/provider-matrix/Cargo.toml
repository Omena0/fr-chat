[package]
name = "fr-chat-provider-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
fr-chat-app-core = { path = "../app-core" }
fr-chat-domain = { path = "../domain" }
fr-chat-provider-api = { path = "../provider-api" }
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", tag = "matrix-sdk-0.18.0", features = ["e2e-encryption", "sqlite", "experimental-widgets", "markdown", "socks", "federation-api", "experimental-search", "local-server"] }
matrix-sdk-sqlite = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", tag = "matrix-sdk-sqlite-0.18.0", optional = true }
mime = "0.3"
rand = "0.8"
ruma-client-api = { version = "0.24", features = ["client"] }
ruma-common = "0.19"
ruma-events = "0.34"
serde_json.workspace = true
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[features]
default = ["sqlite"]
sqlite = ["matrix-sdk-sqlite"]