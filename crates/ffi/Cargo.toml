[package]
name = "fr-chat-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fr-chat-domain = { path = "../domain" }
fr-chat-provider-api = { path = "../provider-api" }
fr-chat-provider-matrix = { path = "../provider-matrix" }
fr-chat-app-core = { path = "../app-core" }
fr-chat-store-sqlite = { path = "../store-sqlite" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"