[workspace]
members = [
    "crates/domain",
    "crates/provider-api",
    "crates/app-core",
    "crates/store-sqlite",
    "crates/provider-matrix",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
